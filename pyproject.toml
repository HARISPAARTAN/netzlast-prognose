[project]
name = "lastprog"
version = "0.1.0"
description = "Netzlast-Prognose: kalibrierte probabilistische Day-ahead-Prognosen der deutschen Netzlast (SMARD), mit vorregistriertem Backtest und FastAPI-Dienst."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Harithas Harikaran" }]
dependencies = [
  "fastapi>=0.115",
  "holidays>=0.100",
  "lightgbm>=4.6",
  "numpy>=2.2,<2.5",
  "pandas>=2.2,<3",
  "pyarrow>=18",
  "requests>=2.32",
  "typer>=0.15",
  "tzdata>=2025.2",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
backtest = ["matplotlib>=3.10", "scipy>=1.15", "statsforecast>=2.1.1"]

[project.scripts]
lastprog = "lastprog.cli:app"

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.3", "responses>=0.25", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lastprog"]

[tool.uv]
exclude-newer = "2026-10-20T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Query"]
